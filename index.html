<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Encyclopedia Generator</title>
<style>
  body {
    font-family: Georgia, "Times New Roman", serif;
    background: #f8f9fa;
    margin: 0;
    padding: 2rem;
    color: #202122;
  }
  #box {
    max-width: 820px;
    margin: auto;
    background: white;
    padding: 2rem;
    border: 1px solid #a2a9b1;
  }
  h1 {
    border-bottom: 1px solid #a2a9b1;
    padding-bottom: 0.3rem;
  }
  button {
    margin-top: 1.5rem;
    padding: 0.6rem 1rem;
    font-size: 1rem;
  }
</style>
</head>

<body>
<div id="box">
  <h1 id="title"></h1>
  <p id="lead"></p>
  <h2>History</h2>
  <p id="history"></p>
  <h2>Characteristics</h2>
  <p id="traits"></p>
  <h2>Cultural Impact</h2>
  <p id="impact"></p>

  <button onclick="generate()">Generate new article</button>
</div>

<script>
function pick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function sentence() {
  const starts = ["The", "This", "In many cases, the", "Historically, the", "Scholars note that the"];
  const mids = ["phenomenon", "structure", "tradition", "device", "system", "practice"];
  const ends = [
    "has been widely misunderstood.",
    "remains poorly documented.",
    "plays a central role in its field.",
    "has generated considerable debate.",
    "continues to shape modern interpretations."
  ];
  return pick(starts) + " " + pick(mids) + " " + pick(ends);
}

function paragraph(n) {
  let p = [];
  for (let i = 0; i < n; i++) p.push(sentence());
  return p.join(" ");
}

function generate() {
  const titles = [
    "Kardevian Lattices",
    "The Rhopex Index",
    "Silent Meridian Theory",
    "Orthian Protocol",
    "Zerenth Drift",
    "Palmaric Alignment",
    "Heliox Paradox"
  ];

  document.getElementById("title").textContent = pick(titles);
  document.getElementById("lead").textContent = paragraph(5);
  document.getElementById("history").textContent = paragraph(7);
  document.getElementById("traits").textContent = paragraph(7);
  document.getElementById("impact").textContent = paragraph(7);
}

// generate first article on load
generate();
</script>
</body>
</html>
